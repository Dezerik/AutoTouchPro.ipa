name: Build unsigned IPA for eSign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify project configuration
        run: test -f project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail

          xcodebuild \
            -project AutoTouchPro.xcodeproj \
            -scheme AutoTouchPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and validate IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/derivedData/Build/Products/Release-iphoneos/AutoTouchPro.app"
          PACKAGE_DIR="$RUNNER_TEMP/ipa-package"

          test -d "$APP_PATH" || { echo "Built app not found: $APP_PATH"; exit 1; }
          test -s "$APP_PATH/Info.plist" || { echo "App Info.plist is missing or empty"; exit 1; }
          test -s "$APP_PATH/AutoTouchPro" || { echo "App executable is missing or empty"; exit 1; }

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          ditto "$APP_PATH" "$PACKAGE_DIR/Payload/AutoTouchPro.app"

          cd "$PACKAGE_DIR"
          /usr/bin/ditto -c -k --sequesterRsrc Payload "$GITHUB_WORKSPACE/AutoTouchPro.ipa"

          unzip -tq "$GITHUB_WORKSPACE/AutoTouchPro.ipa"
          unzip -l "$GITHUB_WORKSPACE/AutoTouchPro.ipa" | grep -q 'Payload/AutoTouchPro.app/Info.plist'

          ls -lh "$GITHUB_WORKSPACE/AutoTouchPro.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchPro-unsigned-IPA
          path: AutoTouchPro.ipa
          if-no-files-found: error
