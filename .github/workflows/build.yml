name: Build AutoTouch Pro IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Verify project config exists
        run: |
          ls -la
          test -f project.yml && echo "project.yml found" || echo "project.yml missing"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated Xcode project
        run: |
          ls -la
          test -d AutoTouchPro.xcodeproj && echo "Xcode project exists" || { echo "Xcode project missing"; exit 1; }

      - name: Build iOS app
        run: |
          xcodebuild \
            -project AutoTouchPro.xcodeproj \
            -scheme AutoTouchPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/derivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/derivedData/Build/Products/Release-iphoneos/AutoTouchPro.app" Payload/
          zip -r AutoTouchPro.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTouchPro.ipa
          path: AutoTouchPro.ipa
